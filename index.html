<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wimberley Watchtower</title>
<link rel="icon" href="favicon_dark_64.png" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon_light_64.png" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="raven_master_512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #0bb8da;
    --accent2: #7A9E6A;
    --text: #e8e4dc;
    --text-muted: #a09890;
    --text-dim: #6a6560;
    --green: #2ecc71;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-weight: 300; min-height: 100vh; }

  header { background: var(--bg); padding: 0; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; padding: 0 24px; background: var(--surface); border: 1px solid var(--border); border-bottom: none; }
  .logo { display: flex; align-items: center; gap: 10px; flex-shrink: 0; cursor: pointer; min-width: 0; }
  .logo-main { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--text); white-space: nowrap; }
  .logo-sub { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; white-space: nowrap; }
  .logo-text { display: flex; flex-direction: column; gap: 3px; }


  .filter-bar-track { max-width: 1200px; margin: 0 auto; position: relative; display: flex; align-items: stretch; background: var(--surface); }
  .filter-inner { flex: 1; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  .filter-inner::-webkit-scrollbar { display: none; }
  .tab-arrow { display: none; align-items: center; justify-content: center; background: var(--surface); border: none; color: var(--text-muted); font-size: 1rem; padding: 0 10px; cursor: pointer; transition: color 0.15s, background 0.15s; flex-shrink: 0; z-index: 2; }
  .tab-arrow:hover { color: var(--text); background: var(--surface2); }
  .tab-arrow.visible { display: flex; }
  .tab-arrow-left { border-right: 1px solid var(--border); }
  .tab-arrow-right { border-left: 1px solid var(--border); }
  .filter-tab { padding: 12px 20px; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; font-family: 'IBM Plex Sans', sans-serif; }
  .filter-tab:hover { color: var(--text); }
  .filter-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }

  /* ── STICKY STACK ─────────────────────────────────────────────────────────── */
  /* Single sticky wrapper — all bars move as one unit, no independent top values */
  .sticky-stack { position: sticky; top: 64px; z-index: 99; background: var(--bg); }

  /* DATE / CLOCK BAR */
  .date-bar { background: var(--bg); }
  .date-bar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 24px; background: var(--surface2); border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .date-bar-date { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--text); letter-spacing: 0.05em; }
  .date-bar-clocks { display: flex; align-items: center; gap: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--text-muted); letter-spacing: 0.04em; }
  .date-bar-clocks span { display: flex; align-items: center; gap: 5px; }
  .date-bar-clocks .time-val { color: var(--text); font-size: 0.7rem; }
  .date-bar-clocks .time-label { color: var(--text-dim); font-size: 0.55rem; letter-spacing: 0.1em; text-transform: uppercase; }

  /* LOCAL ADVISORIES STRIP */
  .alert-strip { background: var(--bg); overflow: hidden; }
  .alert-strip-inner-wrap { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; height: 32px; overflow: hidden; position: relative; background: #1a0800; border-bottom: 1px solid #5a1a00; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .alert-strip-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: #ff6600; padding: 0 14px; white-space: nowrap; flex-shrink: 0; border-right: 1px solid #5a1a00; height: 100%; display: flex; align-items: center; gap: 6px; min-height: 32px; }
  .alert-strip-label .blink { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ff4400; box-shadow: 0 0 6px #ff4400; animation: pulse 1s ease-in-out infinite; }
  .alert-strip-track { flex: 1; overflow: hidden; position: relative; height: 32px; }
  .alert-strip-inner { display: flex; align-items: center; gap: 0; position: absolute; white-space: nowrap; animation: ticker 60s linear infinite; }
  .alert-strip-inner:hover { animation-play-state: paused; }
  @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
  .alert-item { display: inline-flex; align-items: center; gap: 10px; padding: 0 20px; height: 32px; cursor: pointer; transition: background 0.15s; text-decoration: none; }
  @media (hover: hover) { .alert-item:hover { background: rgba(255,102,0,0.08); } }
  .alert-item-source { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; color: #ff6600; letter-spacing: 0.08em; text-transform: uppercase; flex-shrink: 0; }
  .alert-item-title { font-size: 0.78rem; color: #e8c4a0; font-weight: 400; }
  .alert-item-time { font-family: 'IBM Plex Mono', monospace; font-size: 0.58rem; color: #7a4a2a; flex-shrink: 0; }
  .alert-sep { color: #5a2a0a; padding: 0 4px; font-size: 0.7rem; }
  .alert-strip-empty { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: #5a3a2a; padding: 0 16px; height: 32px; display: inline-flex; align-items: center; }
  /* Hays Informed cards (burn ban status + notices) use standard .card styling — no overrides */

  /* SUB-BAR */
  .sub-bar { background: var(--bg); }
  .sub-bar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; background: var(--surface2); border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .sub-bar-inner::-webkit-scrollbar { display: none; }
  .sub-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; letter-spacing: 0.06em; padding: 5px 11px; border-radius: 2px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s; white-space: nowrap; cursor: pointer; flex-shrink: 0; }
  @media (hover: hover) { .sub-btn:hover { border-color: #7FA2C9; color: #7FA2C9; } }
  .sub-btn:focus, .sub-btn:focus-visible, .sub-btn:active { outline: none; border-color: var(--border); color: var(--text-muted); background: none; }
  .sub-bar-weather { display: flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--text-muted); flex-shrink: 0; padding-right: 10px; border-right: 1px solid var(--border); margin-right: 4px; }
  .sub-bar-weather .wx-temp { color: var(--text); font-size: 0.72rem; font-weight: 500; }
  .sub-bar-weather .wx-icon { color: var(--accent2); flex-shrink: 0; }

  /* FILTER BAR */
  .filter-bar { background: var(--bg); transform: translateZ(0); }
  .filter-bar-track { max-width: 1200px; margin: 0 auto; position: relative; display: flex; align-items: stretch; background: var(--surface); border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .filter-inner { flex: 1; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; }
  .filter-inner::-webkit-scrollbar { display: none; }
  .tab-arrow { display: none; align-items: center; justify-content: center; background: var(--surface); border: none; color: var(--text-muted); font-size: 1rem; padding: 0 10px; cursor: pointer; transition: color 0.15s, background 0.15s; flex-shrink: 0; z-index: 2; }
  @media (hover: hover) { .tab-arrow:hover { color: var(--text); background: var(--surface2); } }
  .tab-arrow.visible { display: flex; }
  .tab-arrow-left { border-right: 1px solid var(--border); }
  .tab-arrow-right { border-left: 1px solid var(--border); }
  .filter-tab { padding: 12px 20px; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; background: none; border-top: none; border-left: none; border-right: none; font-family: 'IBM Plex Sans', sans-serif; }
  @media (hover: hover) { .filter-tab:hover { color: var(--text); } }
  .filter-tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }

  /* TOOLBAR */
  .toolbar { background: var(--bg); }
  .toolbar-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 24px; background: var(--surface); border-left: 1px solid var(--border); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 360px; }
  .lang-link { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; background: none; border: 1px solid var(--accent2); color: var(--accent2); font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.05em; padding: 5px 12px; border-radius: 2px; text-decoration: none; white-space: nowrap; flex-shrink: 0; transition: all 0.15s; }
  @media (hover: hover) { .lang-link:hover { background: var(--accent2); color: #0e0e0e; } }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 0.85rem; pointer-events: none; }
  .search-input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 0.8rem; padding: 7px 10px 7px 30px; border-radius: 2px; outline: none; transition: border-color 0.2s; }
  .search-input:focus { border-color: var(--accent2); }
  .search-input::placeholder { color: var(--text-dim); }
  .time-filter-group { display: flex; gap: 2px; }
  .time-btn { background: none; border: 1px solid var(--border); color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.05em; padding: 5px 10px; cursor: pointer; transition: all 0.15s; border-radius: 2px; white-space: nowrap; }
  @media (hover: hover) { .time-btn:hover { color: var(--text); border-color: var(--text-muted); } }
  .time-btn.active { background: var(--accent2); border-color: var(--accent2); color: #0e0e0e; font-weight: 500; }

  main { max-width: 1200px; margin: 0 auto; padding: 28px 0; }
  .status-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 8px; padding: 0 24px; }
  .status-left { display: flex; align-items: center; gap: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text-muted); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.loading { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); animation: pulse 1s ease-in-out infinite; }
  .dot.error { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .story-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text-dim); }

  .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .card { background: var(--surface); padding: 20px; transition: background 0.15s; display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-decoration: none; color: inherit; }
  .card:hover { background: var(--surface2); }
  .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-source { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent2); }

  .card-title { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; line-height: 1.35; color: var(--text); }
  .card-summary { font-size: 0.82rem; line-height: 1.6; color: var(--text-muted); font-weight: 300; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .card-time { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--text-dim); }
  .card-arrow { font-size: 0.7rem; color: var(--text-dim); transition: color 0.15s, transform 0.15s; }
  .card:hover .card-arrow { color: var(--accent2); transform: translateX(3px); }

  .skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); }
  .skeleton-card { background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .skel { background: var(--surface2); border-radius: 2px; animation: shimmer 1.5s ease-in-out infinite; }
  @keyframes shimmer { 0%,100% { opacity: 0.4; } 50% { opacity: 0.8; } }

  /* LOADING OVERLAY — fixed to viewport center, works on any screen size */
  .loading-overlay { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 14px; background: rgba(14,14,14,0.88); backdrop-filter: blur(4px); border: 1px solid var(--border); padding: 28px 40px; z-index: 200; pointer-events: none; border-radius: 4px; }
  .loading-overlay-dot { width: 10px; height: 10px; border-radius: 50%; background: #7FA2C9; box-shadow: 0 0 10px #7FA2C9; animation: pulse 1s ease-in-out infinite; }
  .loading-overlay-text { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; color: #7FA2C9; white-space: nowrap; }
  .loading-overlay-sub { font-family: 'IBM Plex Sans', sans-serif; font-size: 0.72rem; color: var(--text-muted); padding-top: 10px; white-space: nowrap; }

  .empty-state { text-align: center; padding: 80px 24px; color: var(--text-muted); }
  .empty-state h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 8px; color: var(--text-dim); }
  .empty-state p { font-size: 0.85rem; line-height: 1.6; }

  .sources-panel { margin-top: 40px; border-top: 1px solid var(--border); padding: 20px 24px 0; }
  .sources-title { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; }
  .sources-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .source-pill { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; padding: 4px 10px; border: 1px solid var(--border); color: var(--text-muted); letter-spacing: 0.05em; border-radius: 2px; }
  .source-pill.ok { border-color: #1e3a1e; color: #4a9a4a; }
  .source-pill.err { border-color: #3a1e1e; color: #9a4a4a; }

  /* LOCAL ADVISORIES STRIP — see sticky-stack section above */

  /* SUB-BAR — see sticky-stack section above */

  @media (max-width: 600px) {
    .header-inner { height: 56px; }
    .sticky-stack { top: 56px; }
    .logo { flex-direction: row; align-items: center; gap: 10px; }
    .logo-text { justify-content: center; }
    .logo-main { font-size: 1.2rem; }
    .logo-sub { font-size: 0.52rem; letter-spacing: 0.1em; white-space: normal; }
    main { padding: 16px 0; }
    .news-grid, .skeleton-grid { grid-template-columns: 1fr; }
    .toolbar-inner { padding: 8px 16px; }
    .time-btn { padding: 5px 7px; font-size: 0.6rem; }
    .alert-strip-label span:last-child { display: none; }
    .sub-bar-inner { height: 34px; padding: 0 8px; gap: 4px; }
    .sub-btn { font-size: 0.58rem; padding: 3px 7px; gap: 3px; }
    .sub-bar-weather { gap: 3px; }
    .sub-bar-weather .wx-temp { font-size: 0.64rem; }
    .sub-bar-weather svg { width: 12px; height: 12px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo" onclick="filterBy('wimberley', document.querySelector('.filter-tab[onclick*=wimberley]')); document.getElementById('searchInput').value=''; setTimeFilter(168, document.querySelector('.time-btn[data-hours=\'168\']'));">
      <img src="social_avatar_800.png" alt="Wimberley Watchtower" style="height:44px;width:auto;border-radius:4px;flex-shrink:0;display:block;">
      <div class="logo-text">
        <div class="logo-main">
          <span style="color:#7A9E6A">The </span><span style="color:#7FA2C9">Wimberley </span><span style="color:#7A9E6A">Watchtower</span>
        </div>
        <div class="logo-sub">Situational Awareness Dashboard</div>
      </div>
    </div>
  </div>
</header>

<div class="sticky-stack" id="stickyStack">

  <div class="date-bar" id="dateBar">
    <div class="date-bar-inner">
      <div class="date-bar-date" id="dateBarDate">—</div>
      <div class="date-bar-clocks">
        <span><span class="time-val" id="timeCT">—</span><span class="time-label">CT</span></span>
        <span><span class="time-val" id="timeUTC">—</span><span class="time-label">UTC</span></span>
      </div>
    </div>
  </div>

  <div class="alert-strip" id="alertStrip">
    <div class="alert-strip-inner-wrap">
      <div class="alert-strip-label"><span class="blink"></span> <span>Local Advisories</span></div>
      <div class="alert-strip-track" id="alertStripTrack">
        <div class="alert-strip-inner" id="alertStripInner">
          <span class="alert-strip-empty">Loading alerts…</span>
        </div>
      </div>
    </div>
  </div>

  <div class="sub-bar" id="subBar">
    <div class="sub-bar-inner">
      <a class="sub-btn" href="about.html" target="_blank" rel="noopener noreferrer" title="About the Wimberley Watchtower">
        ℹ&#xFE0E; About
      </a>
      <a class="sub-btn" href="https://radar.weather.gov/station/KEWX/standard" target="_blank" title="NWS NEXRAD radar for Wimberley (KEWX Austin/San Antonio)">
        ☁ Radar
      </a>
      <a class="sub-btn" href="https://globe.adsbexchange.com/?lat=30.00&lon=-98.10&zoom=10" target="_blank" title="Live air traffic over Wimberley">
        ✈ In the Sky
      </a>
      <a class="sub-btn" href="https://www.google.com/maps/@29.9870554,-98.0929984,13.25z/data=!5m1!1e1" target="_blank" title="Traffic map for Wimberley">
        ⊸ Traffic
      </a>
      <a class="sub-btn" href="comms.html" target="_blank" title="HAM Radio &amp; Emergency Comms Reference">
        ◉ Radio
      </a>
      <a class="sub-btn sub-btn-iss" href="https://www.heavens-above.com/PassSummary.aspx?satid=25544&lat=30.00&lng=-98.10&loc=Wimberley&alt=300&tz=CST" target="_blank" title="ISS pass times for Wimberley">
        ✦ ISS
      </a>
      <div class="sub-bar-weather" id="wxWidget" title="Current conditions · Wimberley, TX" style="margin-left:auto;">
        <span class="wx-icon" id="wxIcon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" id="wxSvg">
            <circle cx="7" cy="7" r="3" fill="currentColor" opacity="0.3"/>
          </svg>
        </span>
        <span class="wx-temp" id="wxTemp">—°</span>
      </div>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-bar-track">
      <button class="tab-arrow tab-arrow-left" id="tabArrowLeft" onclick="scrollTabs(-200)" aria-label="Scroll tabs left">&#8249;</button>
      <div class="filter-inner" id="filterInner">
        <button class="filter-tab" onclick="filterBy('wimberley', this)">Wimberley</button>
        <button class="filter-tab" onclick="filterBy('hill-country', this)">Hill Country</button>
        <button class="filter-tab" onclick="filterBy('texas', this)">Texas</button>
        <button class="filter-tab" onclick="filterBy('weather-hazards', this)">Weather &amp; Hazards</button>
      </div>
      <button class="tab-arrow tab-arrow-right" id="tabArrowRight" onclick="scrollTabs(200)" aria-label="Scroll tabs right">&#8250;</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" type="text" placeholder="Search..." oninput="applyDisplayFilters()">
      </div>
      <div class="time-filter-group">
        <button class="time-btn" data-hours="8" onclick="setTimeFilter(8, this)">8h</button>
        <button class="time-btn" data-hours="24" onclick="setTimeFilter(24, this)">24h</button>
        <button class="time-btn active" data-hours="168" onclick="setTimeFilter(168, this)">7d</button>
        <button class="time-btn" data-hours="336" onclick="setTimeFilter(336, this)">14d</button>
      </div>
      <a class="lang-link" href="https://translate.google.com/translate?sl=en&amp;tl=es&amp;u=https://wimberley.watch" target="_blank" rel="noopener" aria-label="Ver esta página en español">🌐 ESPAÑOL</a>
    </div>
  </div>

</div><!-- /.sticky-stack -->

<main>
  <div class="status-bar">
    <div class="status-left"></div>
    <div class="story-count" id="storyCount"></div>
  </div>

// ─── DEDUPLICATION ────────────────────────────────────────────────────────────
// Strips a title down to a normalized fingerprint for comparison:
// lowercase, remove punctuation/stopwords, collapse whitespace.
function titleFingerprint(title) {
  return title.toLowerCase()
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\b(a|an|the|in|on|at|to|for|of|and|or|is|are|was|were|says|say)\b/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

// Given a sorted array of articles, remove duplicates by title similarity.
// Keeps the first occurrence (earliest in sort order = most recent date).
// Two articles are considered duplicates if their fingerprints share
// >= DEDUPE_THRESHOLD fraction of words.
const DEDUPE_THRESHOLD = 0.6; // 60% word overlap = duplicate

function deduplicate(articles) {
  const kept = [];
  const fingerprints = [];

  for (const article of articles) {
    const fp = titleFingerprint(article.title);
    const fpWords = new Set(fp.split(' ').filter(w => w.length > 2));
    if (!fpWords.size) { kept.push(article); continue; }

    const isDupe = fingerprints.some(existingWords => {
      const intersection = [...fpWords].filter(w => existingWords.has(w)).length;
      const union = new Set([...fpWords, ...existingWords]).size;
      return intersection / union >= DEDUPE_THRESHOLD;
    });

    if (!isDupe) {
      kept.push(article);
      fingerprints.push(fpWords);
    }
  }
  return kept;
}

function isBlocked(article) {
  const haystack = (article.title + ' ' + (article.summary || '')).toLowerCase();
  return BLOCK_KEYWORDS.some(kw => haystack.includes(kw));
}

// Only 3 Spanish-language feeds — within the safe threshold for MyMemory free tier.
const TRANSLATE_API = 'https://api.mymemory.translated.net/get';
async function translate(text, fromLang = 'es') {
  if (!text || !text.trim()) return text;
  try {
    const params = new URLSearchParams({ q: text.slice(0, 500), langpair: fromLang + '|en' });
    const r = await fetch(TRANSLATE_API + '?' + params, { signal: AbortSignal.timeout(6000) });
    const d = await r.json();
    if (d.responseStatus === 200 && d.responseData?.translatedText) return d.responseData.translatedText;
  } catch (e) {}
  return text;
}

// ─── PROXY HELPERS ────────────────────────────────────────────────────────────
function parseRSSXml(xml) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xml, 'text/xml');

  // RSS feed
  const items = [...doc.querySelectorAll('item')];
  if (items.length) {
    return items.map(item => {
      let link = '';
      const linkEl = item.querySelector('link');
      if (linkEl) {
        link = linkEl.textContent || linkEl.getAttribute('href') || '';
        if (!link && linkEl.nextSibling) link = linkEl.nextSibling.textContent || '';
      }
      if (!link) link = item.querySelector('guid')?.textContent || '#';
      return {
        title: item.querySelector('title')?.textContent || '',
        description: item.querySelector('description')?.textContent || '',
        link: link.trim(),
        pubDate: item.querySelector('pubDate')?.textContent || '',
      };
    });
  }

  // ATOM feed (e.g. NWS CAP alerts)
  const entries = [...doc.querySelectorAll('entry')];
  if (entries.length) {
    return entries.map(entry => {
      const linkEl = entry.querySelector('link');
      const link = linkEl ? (linkEl.getAttribute('href') || linkEl.textContent || '') : '#';
      const summary = entry.querySelector('summary')?.textContent || entry.querySelector('content')?.textContent || '';
      return {
        title: entry.querySelector('title')?.textContent || '',
        description: summary,
        link: link.trim(),
        pubDate: entry.querySelector('published')?.textContent || entry.querySelector('updated')?.textContent || '',
      };
    });
  }

  throw new Error('No items or entries found');
}

async function tryWorker(url) {
  const r = await fetch('https://proxy.wimberley.watch/?url=' + encodeURIComponent(url), { signal: AbortSignal.timeout(9000) });
  if (!r.ok) throw new Error('worker: status ' + r.status);
  const xml = await r.text();
  return parseRSSXml(xml);
}

async function tryRss2Json(url) {
  const r = await fetch('https://api.rss2json.com/v1/api.json?count=8&rss_url=' + encodeURIComponent(url), { signal: AbortSignal.timeout(9000) });
  const d = await r.json();
  if (d.status !== 'ok' || !d.items?.length) throw new Error('rss2json: no items');
  return d.items.map(i => ({ title: i.title, description: i.description, link: i.link || i.guid, pubDate: i.pubDate }));
}

async function tryAllOrigins(url) {
  const r = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent(url), { signal: AbortSignal.timeout(9000) });
  const d = await r.json();
  if (!d.contents) throw new Error('allorigins: empty');
  return parseRSSXml(d.contents);
}

async function tryCorsProxy(url) {
  const r = await fetch('https://corsproxy.io/?' + encodeURIComponent(url), { signal: AbortSignal.timeout(9000) });
  const xml = await r.text();
  return parseRSSXml(xml);
}

async function fetchFeedItems(url) {
  for (const fn of [tryWorker, tryAllOrigins, tryCorsProxy, tryRss2Json]) {
    try {
      const items = await fn(url);
      if (items && items.length) return items;
    } catch (e) {}
  }
  throw new Error('All proxies failed for: ' + url);
}

// ─── FETCH ONE FEED ───────────────────────────────────────────────────────────
async function fetchFeed(feed) {
  try {
    const items = await fetchFeedItems(feed.url);
    const needsTranslation = feed.lang && feed.lang !== 'en';
    const articles = await Promise.all(items.slice(0, feed.max || 8).map(async item => {
      const rawTitle = decodeEntities((item.title || '').trim());
      let rawSummary = decodeEntities(item.description || '').replace(/<[^>]+>/g, '').replace(/&[a-z#0-9]+;/gi, ' ').replace(/\s+/g, ' ').trim();
      if (rawSummary.length > 180) rawSummary = rawSummary.slice(0, 180) + '…';

      let title = rawTitle;
      let summary = rawSummary;

      if (needsTranslation && rawTitle) {
        [title, summary] = await Promise.all([
          translate(rawTitle, feed.lang),
          rawSummary ? translate(rawSummary, feed.lang) : Promise.resolve(''),
        ]);
        if (!title) title = rawTitle;
        if (!summary) summary = rawSummary;
      }

      return {
        title: title.trim(),
        summary: summary.trim(),
        rawTitle,
        rawSummary,
        link: item.link || '#',
        source: feed.name,
        lang: feed.lang,
        tags: feed.tags,
        date: item.pubDate ? new Date(item.pubDate) : new Date(),
      };
    }));
    sourceStatus[feed.name] = 'ok';
    return articles.filter(a => a.title && isRelevant(a) && !isBlocked(a));
  } catch (e) {
    sourceStatus[feed.name] = 'error';
    return [];
  }
}

// ─── SECURITY ─────────────────────────────────────────────────────────────────
// Decodes HTML entities (both named and numeric) from raw feed text.
// Runs before escapeHTML so entities like &amp; and &#x5b; resolve to real characters.
function decodeEntities(str) {
  if (!str) return '';
  const txt = document.createElement('textarea');
  txt.innerHTML = str;
  return txt.value;
}

// Escapes untrusted RSS content before insertion into innerHTML.
// All feed-derived fields (title, summary, source, link) must pass through this.
function escapeHTML(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ─── ROUND-ROBIN INTERLEAVE ───────────────────────────────────────────────────
// For high-velocity tabs, distribute cards by source so no outlet dominates a run.
// Groups articles by source, sorts each group newest-first, then interleaves:
// take article[0] from each source, then article[1], etc. Exhausted sources drop out.
const INTERLEAVE_TABS = new Set(['national', 'geopolitics', 'finance', 'cyber-ai-tech', 'texas']);

function interleaveBySource(articles) {
  // Build a map: sourceName → [articles sorted newest-first]
  const buckets = new Map();
  for (const a of articles) {
    if (!buckets.has(a.source)) buckets.set(a.source, []);
    buckets.get(a.source).push(a);
  }
  // Each bucket is already ordered newest-first because allArticles is sorted that way,
  // but sort explicitly to be safe.
  for (const arr of buckets.values()) {
    arr.sort((a, b) => b.date - a.date);
  }
  // Round-robin: pull one card per source per pass until all buckets empty
  const queues = [...buckets.values()];
  const result = [];
  let i = 0;
  while (result.length < articles.length) {
    let advanced = false;
    for (const q of queues) {
      if (i < q.length) { result.push(q[i]); advanced = true; }
    }
    if (!advanced) break;
    i++;
  }
  return result;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function timeAgo(date) {
  const diff = (Date.now() - date.getTime()) / 1000;
  if (isNaN(diff) || diff < 0) return '';
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function renderCards(articles) {
  const container = document.getElementById('newsContainer');
  container.innerHTML = '';

  if (!articles.length) {
    container.innerHTML = '<div class="empty-state"><h3>No stories found</h3><p>Some feeds may be temporarily unavailable.<br>Check the source status below or try refreshing.</p></div>';
    document.getElementById('storyCount').textContent = '0 stories';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'news-grid';

  articles.forEach(a => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = a.link;
    card.target = '_blank';
    card.rel = 'noopener noreferrer';
    const ago = (a.isBurnBanStatus || a.isHaysNotice) ? '' : timeAgo(a.date);
    card.innerHTML =
      '<div class="card-meta">' +
        '<span class="card-source">' + escapeHTML(a.source) + '</span>' +
      '</div>' +
      '<div class="card-title">' + escapeHTML(a.title) + '</div>' +
      (a.summary ? '<div class="card-summary">' + escapeHTML(a.summary) + '</div>' : '') +
      '<div class="card-footer">' +
        '<span class="card-time">' + escapeHTML(a.statusDate || ago) + '</span>' +
        '<span class="card-arrow">&#x2192;</span>' +
      '</div>';
    grid.appendChild(card);
  });

  container.appendChild(grid);
  document.getElementById('storyCount').textContent = articles.length + ' stor' + (articles.length !== 1 ? 'ies' : 'y');
}

  const list = document.getElementById('sourcesList');

}

function applyDisplayFilters() {
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  const isBreakingTab = currentFilter === 'breaking';

  let filtered = allArticles.filter(a => a.tags.includes(currentFilter));

  // Breaking defaults to 8h; otherwise use the user's selected time filter
  const effectiveHours = currentTimeHours;
  if (effectiveHours > 0) {
    const cutoff = Date.now() - effectiveHours * 3600 * 1000;
    filtered = filtered.filter(a => (a.isBurnBanStatus || a.isHaysNotice) || (a.date && a.date.getTime() >= cutoff));
  }

  if (query) {
    filtered = filtered.filter(a =>
      a.title.toLowerCase().includes(query) ||
      (a.summary && a.summary.toLowerCase().includes(query))
    );
  }

  const TAB_STORY_CAPS = {
    'civil-liberties-privacy': 60,
    'cyber-ai-tech': 60,
  };
  if (TAB_STORY_CAPS[currentFilter]) {
    filtered = filtered.slice(0, TAB_STORY_CAPS[currentFilter]);
  }

  // Round-robin interleaving for high-velocity tabs
  if (INTERLEAVE_TABS.has(currentFilter)) {
    filtered = interleaveBySource(filtered);
  }

  renderCards(filtered);
}

// ─── PRIORITY QUEUE ───────────────────────────────────────────────────────────
// Runs an array of async tasks with a concurrency cap of `limit`.
// Returns results in the same order as the input array (like Promise.allSettled).
async function runQueue(tasks, limit = 8) {
  const results = new Array(tasks.length);
  let index = 0;

  async function worker() {
    while (index < tasks.length) {
      const i = index++;
      try {
        results[i] = { status: 'fulfilled', value: await tasks[i]() };
      } catch (e) {
        results[i] = { status: 'rejected', reason: e };
      }
    }
  }

  const workers = Array.from({ length: Math.min(limit, tasks.length) }, worker);
  await Promise.all(workers);
  return results;
}

    '</div>';

  const phase1Feeds = FEEDS.filter(f => f.phase === 1);
  const phase2Feeds = FEEDS.filter(f => f.phase === 2);

  // ── PHASE 1: Wimberley + Hill Country + NWS/HaysInformed (highest priority) ──
  const [phase1Results, nwsAlerts, haysInformedCards] = await Promise.all([

  const phase1Articles = phase1Results.flatMap(r => r.status === 'fulfilled' ? r.value : []);

  // Drop the full-page overlay — Phase 1 is ready
  document.getElementById('loadingOverlay')?.remove();
  if (btn) btn.classList.remove('loading');
  if (icon) { icon.className = ''; icon.textContent = '↻'; }

  renderSourcePills();

  applyDisplayFilters();

  const phase2Results = await runQueue(phase2Feeds.map(f => () => fetchFeed(f)), 8);
  const phase2Articles = phase2Results.flatMap(r => r.status === 'fulfilled' ? r.value : []);
  allArticles = deduplicate([...allArticles, ...phase2Articles].sort((a, b) => b.date - a.date));

  // Remove tab overlay if user is currently on a Phase 2 tab
  const p2Phase = TAB_PHASE[currentFilter];

// ─── ALERT STRIP ──────────────────────────────────────────────────────────────
function renderAlertStrip() {
  // All hazard terms require a local geo match to prevent false positives from
  // distant incidents and narrative news coverage
  const GEO_GATED_TERMS = [
    // Severe weather
    'flash flood warning','flash flood watch','flood warning','flood watch',
    'tornado warning','tornado watch','severe thunderstorm warning','severe thunderstorm watch',
    'winter storm warning','winter storm watch','ice storm warning',
    'fire weather watch','red flag warning',
    // Fire & evacuation
    'wildfire','wildfire warning','wildfire emergency',
    'evacuation order','evacuation warning','mandatory evacuation',
    // Public safety
    'active shooter','shelter in place',
    'amber alert','silver alert','missing person',
    // Hazmat & infrastructure
    'hazmat','hazardous materials','chemical spill','gas leak',
    'boil water notice','boil water advisory',
    'dam failure','dam breach','levee failure',
    // Health
    'public health emergency','disease outbreak','health emergency',
    // Seismic
    'earthquake warning','earthquake alert',
    // Local incidents (active conditions only — past-tense news terms removed)
    'lockdown','road closure','bridge closure',
    'water outage','power outage','utility outage'
  ];

  // Local geo terms used for filtering
  const GEO_TERMS = [
    'wimberley','hays county','hays co','blanco river','cypress creek',
    'wimberley valley','woodcreek','jacob\'s well','jacobs well',
    'devil\'s backbone','devils backbone','kyle','buda','dripping springs',
    'san marcos','comal county','lcra','gbra'
  ];

  const NWS_SOURCES = new Set(['Comal County · Alerts']);
  const NWS_DIRECT = new Set(['NWS · Hays County']);

  const cutoff = Date.now() - 8 * 3600 * 1000;
  const alerts = allArticles
    .filter(a => {
      if (!a.tags.includes('breaking')) return false;
      const hay = (a.title + ' ' + (a.summary || '') + ' ' + (a.rawTitle || '') + ' ' + (a.rawSummary || '')).toLowerCase();
      // NWS · Hays County alerts get a free pass — already filtered to Hays/Wimberley at the API level
      if (NWS_DIRECT.has(a.source)) return true;
      if (!a.date || a.date.getTime() < cutoff) return false;
      if (NWS_SOURCES.has(a.source)) {
        return hay.includes('hays') || hay.includes('wimberley');
      }
      // All hazard terms require a local geo match
      const hasGeoGated = GEO_GATED_TERMS.some(kw => hay.includes(kw));
      const hasGeo = GEO_TERMS.some(kw => hay.includes(kw));
      return hasGeoGated && hasGeo;
    })
    .slice(0, 20);

  const inner = document.getElementById('alertStripInner');
  if (!inner) return;

  if (!alerts.length) {
    inner.innerHTML = '<span class="alert-strip-empty">No active advisories</span>';
    inner.style.animation = 'none';
    return;
  }

  const track = document.getElementById('alertStripTrack');
  const trackWidth = track ? track.offsetWidth : 800;

  // ── Normal alerts ─────────────────────────────────────────────────────────────
  const buildItems = () => alerts.map(a => {
    const ago = timeAgo(a.date);
    return '<a class="alert-item" href="' + escapeHTML(a.link) + '" target="_blank" rel="noopener noreferrer">' +
      '<span class="alert-item-source">' + escapeHTML(a.source) + '</span>' +
      '<span class="alert-item-title">' + escapeHTML(a.title) + '</span>' +
      '<span class="alert-item-time">' + escapeHTML(ago) + '</span>' +
      '</a><span class="alert-sep">·</span>';
  }).join('');

  // Repeat until content is wide enough to scroll naturally, then double for seamless loop
  const minWidth = trackWidth * 2.5;
  const estItemWidth = 160;
  const repeats = Math.max(1, Math.ceil(minWidth / (alerts.length * estItemWidth)));
  let padded = '';
  for (let i = 0; i < repeats; i++) padded += buildItems();
  inner.innerHTML = padded + padded;
  inner.style.animation = '';

  const contentWidth = inner.scrollWidth / 2;
  const duration = Math.max(20, Math.round(contentWidth / 80));
  inner.style.animationDuration = duration + 's';
}


// ─── NWS ALERTS (api.weather.gov) ────────────────────────────────────────────
// Fetches all active NWS alerts for Texas from the api.weather.gov GeoJSON
// endpoint — CORS-permissive, no proxy needed. Filters to Hays/Wimberley.
// ?area=TX is the only query that reliably returns watch-level products;
// zone and county endpoints miss SPC watch boxes.
// Uses the alert's own 'expires' timestamp rather than the generic 8h cutoff.
async function fetchNWSAlerts() {
  try {
    const r = await fetch('https://api.weather.gov/alerts/active?area=TX', {
      signal: AbortSignal.timeout(9000)
    });
    if (!r.ok) return [];
    const data = await r.json();
    const features = (data.features || []).filter(f => {
      const area = (f.properties?.areaDesc || '').toLowerCase();
      const desc = (f.properties?.description || '').toLowerCase();
      const headline = (f.properties?.headline || '').toLowerCase();
      return area.includes('hays') || area.includes('wimberley') ||
             desc.includes('hays') || desc.includes('wimberley') ||
             headline.includes('hays') || headline.includes('wimberley');
    });
    const now = Date.now();
    return features
      .map(f => {
        const p = f.properties;
        const expires = p.expires ? new Date(p.expires) : null;
        // Skip already-expired alerts
        if (expires && expires.getTime() < now) return null;
        const sent = p.sent ? new Date(p.sent) : new Date();
        const headline = p.headline || p.event || 'NWS Alert';
        const description = p.description
          ? p.description.replace(/\s+/g, ' ').trim().slice(0, 180) + '\u2026'
          : '';
        return {
          title: headline,
          summary: description,
          rawTitle: headline,
          rawSummary: description,
          link: 'https://www.weather.gov/ewx',
          source: 'NWS \u00b7 Hays County',
          lang: 'en',
          tags: ['weather-hazards', 'breaking'],
          date: sent,
          nwsExpires: expires
        };
      })
      .filter(Boolean);
  } catch(e) {
    return [];
  }
}

// ─── HAYS INFORMED FETCH ──────────────────────────────────────────────────────
// Fetches haysinformed.com homepage once per 4 hours and extracts:
//   1. Burn ban status card — always shown in Wimberley feed, ON or OFF + date
//   2. Public health / emergency notice cards — always shown in Wimberley feed
// Source of truth: Hays County OES manually updates this page.
// Proxied through the Cloudflare Worker (same as RSS feeds) to avoid CORS.
const HAYS_INFORMED_CACHE_KEY = 'ww_haysinformed_cache';
const HAYS_INFORMED_CACHE_MS = 4 * 60 * 60 * 1000; // 4 hours

async function fetchHaysInformed() {
  const now = Date.now();

  // Check cache first
  try {
    const stored = localStorage.getItem(HAYS_INFORMED_CACHE_KEY);
    if (stored) {
      const cached = JSON.parse(stored);
      if ((now - cached.checkedAt) < HAYS_INFORMED_CACHE_MS) {
        return cached.cards || [];
      }
    }
  } catch(e) { /* proceed to fetch */ }

  try {
    const targetUrl = 'https://www.haysinformed.com/';
    const proxyUrl = 'https://proxy.wimberley.watch/?url=' + encodeURIComponent(targetUrl);
    const r = await fetch(proxyUrl, { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error('fetch failed');
    const html = await r.text();

    const cards = [];

    // ── 1. Burn ban status ────────────────────────────────────────────────────
    // Look for burn ban ON or LIFTED text on the page
    const lc = html.toLowerCase();
    let burnBanOn = false;
    let statusDate = '';
    let statusSummary = '';

    if (lc.includes('burn ban lifted') || lc.includes('lifted the burn ban')) {
      burnBanOn = false;
      // Try to extract the date from surrounding text
      const liftMatch = html.match(/lifted the Burn Ban as of ([A-Za-z]+ \d+,?\s*\d{4})/i)
        || html.match(/Burn Ban Lifted[^<]*?(\w+ \d+,?\s*\d{4})/i);
      if (liftMatch) statusDate = 'Lifted ' + liftMatch[1].trim();

      // Check for reinstatement note
      const reinstateMatch = html.match(/reinstated?(?:\s+on)?\s+([A-Za-z]+ \d+,?\s*\d{4})/i);
      statusSummary = reinstateMatch
        ? 'Burn ban lifted. Reinstated ' + reinstateMatch[1].trim() + '.'
        : 'Hays County burn ban is not currently in effect.';
    } else if (lc.includes('burn ban in effect') || lc.includes('burn ban is in effect') || lc.includes('burn ban on')) {
      burnBanOn = true;
      const onMatch = html.match(/burn ban[^<]*?(?:in effect|on)[^<]*?(?:as of|since)?\s*([A-Za-z]+ \d+,?\s*\d{4})/i);
      if (onMatch) statusDate = 'In effect ' + onMatch[1].trim();
      statusSummary = 'Hays County burn ban is currently in effect. Visit haysinformed.com for details.';
    } else {
      // Fallback: no clear signal — show unknown
      burnBanOn = false;
      statusDate = 'Status unknown';
      statusSummary = 'Visit haysinformed.com for current burn ban status.';
    }

    cards.push({
      title: burnBanOn ? 'Burn Ban: ON' : 'Burn Ban: OFF',
      summary: statusSummary,
      rawTitle: burnBanOn ? 'Burn Ban: ON' : 'Burn Ban: OFF',
      rawSummary: statusSummary,
      link: 'https://www.haysinformed.com/',
      source: 'Hays County Fire Marshal',
      lang: 'en',
      tags: ['wimberley', 'weather-hazards'],
      date: new Date(now - 1), // just before now so it sorts behind truly live content
      statusDate: statusDate,
      isBurnBanStatus: true,
      burnBanOn: burnBanOn
    });

    // ── 2. Public health / emergency notices ──────────────────────────────────
    // Parse h2/h3/h4/h5 headings followed by text — skip burn ban and generic UI headings
    const SKIP_PATTERNS = [
      /burn ban/i, /know what to do/i, /understand the difference/i,
      /protect your home/i, /assistance.{0,10}advisories/i,
      /hays county businesses/i, /istat/i, /current emergency information/i,
      /preparedness/i, /sign up/i, /emergency alert/i,
      /hays informed hays county/i, /office of emergency services/i,
      /small business/i, /economic injury/i, /disaster loan/i,
      /learn how to/i, /create a barrier/i, /wildfire action plan/i,
      /contact us/i, /quick links/i, /book online/i
    ];

    // Extract headings with their following paragraph text
    const headingRegex = /<h[2-5][^>]*>([\s\S]*?)<\/h[2-5]>/gi;
    let match;
    while ((match = headingRegex.exec(html)) !== null) {
      const raw = match[1].replace(/<[^>]+>/g, '').trim();
      if (!raw || raw.length < 10) continue;
      if (SKIP_PATTERNS.some(p => p.test(raw))) continue;

      // Only surface notices that look like dated/specific announcements
      // Must contain a year, a month name, or key health/emergency words
      const isRelevant = /20\d\d|january|february|march|april|may|june|july|august|september|october|november|december|rabies|outbreak|health|notice|warning|alert|emergency|advisory/i.test(raw);
      if (!isRelevant) continue;

      // Grab the text following this heading (up to 300 chars, strip tags)
      const afterHeading = html.slice(match.index + match[0].length, match.index + match[0].length + 800);
      const summaryMatch = afterHeading.match(/<p[^>]*>([\s\S]*?)<\/p>/i);
      let summary = '';
      if (summaryMatch) {
        summary = summaryMatch[1].replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim().slice(0, 220);
        if (summary.length === 220) summary += '…';
      }

      cards.push({
        title: raw,
        summary: summary,
        rawTitle: raw,
        rawSummary: summary,
        link: 'https://www.haysinformed.com/',
        source: 'Hays County OES',
        lang: 'en',
        tags: ['wimberley', 'public-health'],
        date: new Date(now - 2),
        statusDate: 'Active notice',
        isHaysNotice: true
      });
    }

    // Persist to cache
    try {
      localStorage.setItem(HAYS_INFORMED_CACHE_KEY, JSON.stringify({ checkedAt: now, cards }));
    } catch(e) { /* non-fatal */ }

    return cards;
  } catch(e) {
    return [];
  }
}

// ─── WEATHER WIDGET ───────────────────────────────────────────────────────────
// ─── MOON PHASE ───────────────────────────────────────────────────────────────
// Returns 0–7 phase index and name based on date math (no API needed).
// Phase index: 0=New, 1=Waxing Crescent, 2=First Quarter, 3=Waxing Gibbous,
//              4=Full, 5=Waning Gibbous, 6=Last Quarter, 7=Waning Crescent
function getMoonPhase(date) {
  // Known new moon: Jan 6, 2000 18:14 UTC
  const knownNew = new Date('2000-01-06T18:14:00Z');
  const LUNAR_CYCLE = 29.530588853; // days
  const elapsed = (date - knownNew) / (1000 * 60 * 60 * 24);
  const phase = ((elapsed % LUNAR_CYCLE) + LUNAR_CYCLE) % LUNAR_CYCLE;
  const fraction = phase / LUNAR_CYCLE; // 0–1
  const names = ['New Moon','Waxing Crescent','First Quarter','Waxing Gibbous','Full Moon','Waning Gibbous','Last Quarter','Waning Crescent'];
  const index = Math.floor(fraction * 8) % 8;
  const illum = Math.round((1 - Math.cos(fraction * 2 * Math.PI)) / 2 * 100);
  return { index, name: names[index], fraction, illum };
}

// Moon phase SVG paths — 14x14px, same minimal stroke style as sun icon
// All use a circle outline + shaded/lit hemisphere approach
function moonPhaseSvg(index) {
  // Shared circle outline
  const outline = '<circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1" fill="none"/>';
  switch(index) {
    case 0: // New Moon — dark filled circle
      return '<circle cx="7" cy="7" r="5.5" fill="currentColor" opacity="0.15"/>' + outline;
    case 1: // Waxing Crescent — thin right sliver lit
      return outline + '<path d="M7 1.5 A5.5 5.5 0 0 1 7 12.5 A3 5.5 0 0 0 7 1.5Z" fill="currentColor"/>';
    case 2: // First Quarter — right half lit
      return outline + '<path d="M7 1.5 A5.5 5.5 0 0 1 7 12.5 L7 1.5Z" fill="currentColor"/>';
    case 3: // Waxing Gibbous — mostly lit, left dark sliver
      return '<circle cx="7" cy="7" r="5.5" fill="currentColor"/>' + outline + '<path d="M7 1.5 A5.5 5.5 0 0 0 7 12.5 A2.5 5.5 0 0 1 7 1.5Z" fill="none" stroke="none"/><path d="M7 1.5 A2.5 5.5 0 0 0 7 12.5" fill="var(--bg)" stroke="none"/><path d="M7 1.5 Q3 4 3 7 Q3 10 7 12.5" fill="var(--bg)"/>' + outline;
    case 4: // Full Moon — fully lit
      return '<circle cx="7" cy="7" r="5.5" fill="currentColor"/>' + outline;
    case 5: // Waning Gibbous — mostly lit, right dark sliver
      return '<circle cx="7" cy="7" r="5.5" fill="currentColor"/>' + outline + '<path d="M7 1.5 Q11 4 11 7 Q11 10 7 12.5" fill="var(--bg)"/>' + outline;
    case 6: // Last Quarter — left half lit
      return outline + '<path d="M7 1.5 A5.5 5.5 0 0 0 7 12.5 L7 1.5Z" fill="currentColor"/>';
    case 7: // Waning Crescent — thin left sliver lit
      return outline + '<path d="M7 1.5 A5.5 5.5 0 0 0 7 12.5 A3 5.5 0 0 1 7 1.5Z" fill="currentColor"/>';
    default: return outline;
  }
}

// WMO weather code → SVG icon paths (Wimberley, TX — accent2 green tint)
function wxSvgPath(code, isDay) {
  // ── Nighttime icons ────────────────────────────────────────────────────────
  if (!isDay) {
    const { index, name, illum } = getMoonPhase(new Date());
    // Store phase name + illumination for tooltip update
    wxSvgPath._moonName = name + ' · ' + illum + '%';
    // Clear night — moon phase
    if (code === 0) return moonPhaseSvg(index);
    // Partly cloudy night — moon + cloud
    if (code <= 2) {
      const moon = moonPhaseSvg(index).replace(/<circle cx="7" cy="7"/g, '<circle cx="5" cy="5"').replace(/cx="7" cy="7" r="5\.5"/g, 'cx="5" cy="5" r="3.8"').replace(/cx="7"/g, 'cx="5"').replace(/cy="7"/g, 'cy="5"');
      return '<g transform="scale(0.65) translate(0,0)">' + moonPhaseSvg(index) + '</g>' +
        '<path d="M3 11.5 Q1.5 11.5 1.5 10 Q1.5 8.5 3 8.2 Q3.5 6.5 5.5 6.5 Q7.5 6.5 8 8 Q9.5 8 10 10 Q10 11.5 8.5 11.5Z" fill="currentColor"/>';
    }
    // All other night codes fall through to shared icons below
    wxSvgPath._moonName = null;

  // Partly cloudy
  if (code <= 2) return '<circle cx="5.5" cy="7.5" r="2" fill="currentColor" opacity="0.5"/><circle cx="4" cy="6" r="2.5" fill="currentColor" opacity="0.6"/><path d="M2 8.5 Q1 8.5 1 7.5 Q1 6 2.5 6 Q2.8 4 5 4 Q7 4 7.5 6 Q9 6 9 7.5 Q9 8.5 8 8.5Z" fill="currentColor"/><circle cx="9" cy="5" r="2" fill="currentColor" opacity="0.7"/><line x1="9" y1="1.5" x2="9" y2="2.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><line x1="11.5" y1="5" x2="12.5" y2="5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><line x1="11" y1="3" x2="11.8" y2="2.2" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>';
  // Overcast
  if (code === 3) return '<path d="M2.5 9.5 Q1 9.5 1 8 Q1 6.5 2.5 6.2 Q3 4 5.5 4 Q7.8 4 8.5 6 Q10.5 6 11 8 Q11 9.5 9.5 9.5Z" fill="currentColor"/>';
  // Fog
  if (code <= 49) return '<line x1="2" y1="5" x2="12" y2="5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="1" y1="7" x2="13" y2="7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="2" y1="9" x2="12" y2="9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>';
  // Drizzle / light rain
  if (code <= 67) return '<path d="M2.5 7 Q1 7 1 5.5 Q1 4 2.5 3.7 Q3 1.5 5.5 1.5 Q7.8 1.5 8.5 3.5 Q10.5 3.5 11 5.5 Q11 7 9.5 7Z" fill="currentColor" opacity="0.8"/><line x1="4" y1="9" x2="3.5" y2="11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="7" y1="9" x2="6.5" y2="11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="10" y1="9" x2="9.5" y2="11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>';
  // Snow
  if (code <= 77) return '<path d="M2.5 7 Q1 7 1 5.5 Q1 4 2.5 3.7 Q3 1.5 5.5 1.5 Q7.8 1.5 8.5 3.5 Q10.5 3.5 11 5.5 Q11 7 9.5 7Z" fill="currentColor" opacity="0.7"/><line x1="4" y1="9" x2="4" y2="12" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><line x1="2.5" y1="10.5" x2="5.5" y2="10.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><line x1="7.5" y1="9" x2="7.5" y2="12" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><line x1="6" y1="10.5" x2="9" y2="10.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>';
  // Thunderstorm
  return '<path d="M1.5 7.5 Q0.5 7.5 0.5 6 Q0.5 4.5 2 4.2 Q2.5 2 5 2 Q7.3 2 8 4 Q10 4 10.5 6 Q10.5 7.5 9 7.5Z" fill="currentColor" opacity="0.8"/><polyline points="6,7.5 4.5,10 6.5,10 5,13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
}

async function fetchWeather() {
  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=30.00&longitude=-98.10&current=temperature_2m,weathercode,is_day&temperature_unit=fahrenheit&timezone=America%2FChicago', { signal: AbortSignal.timeout(6000) });
    const d = await r.json();
    const temp = Math.round(d.current.temperature_2m);
    const code = d.current.weathercode;
    const isDay = d.current.is_day === 1;
    const tempEl = document.getElementById('wxTemp');
    const svgEl = document.getElementById('wxSvg');
    const widget = document.getElementById('wxWidget');
    if (tempEl) tempEl.textContent = temp + '°';
    if (svgEl) {
      wxSvgPath._moonName = null;
      svgEl.innerHTML = wxSvgPath(code, isDay);
      if (widget) {
        if (!isDay) {
          const { name, illum } = getMoonPhase(new Date());
          widget.title = name + ' · ' + illum + '% · Wimberley, TX';
        } else {
          widget.title = 'Current conditions · Wimberley, TX';
        }
      }
    }
  } catch(e) {
    // silently fail — widget stays at —°
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
// Set Wimberley as the default active tab BEFORE loading feeds
currentFilter = 'wimberley';
document.querySelectorAll('.filter-tab').forEach(t => {
  if (t.getAttribute('onclick') && t.getAttribute('onclick').includes("'wimberley'")) {
    t.classList.add('active');
  }
});
function updateClocks() {
  const now = new Date();
  const ctEl = document.getElementById('timeCT');
  const utcEl = document.getElementById('timeUTC');
  const dateEl = document.getElementById('dateBarDate');
  if (ctEl) ctEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Chicago', hour12: false });
  if (utcEl) utcEl.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC', hour12: false }) + 'Z';
  if (dateEl) dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: 'America/Chicago' });
}
updateClocks();
setInterval(updateClocks, 60 * 1000);

loadAllFeeds();
fetchWeather();
setInterval(fetchWeather, 15 * 60 * 1000); // refresh weather every 15 min
// Wire up tab arrow visibility on scroll and resize
window.addEventListener('load', () => {
  const el = document.getElementById('filterInner');
  if (el) {
    el.addEventListener('scroll', updateTabArrows);
    updateTabArrows();
  }
});
window.addEventListener('resize', updateTabArrows);

// ─── AUTO-REFRESH ─────────────────────────────────────────────────────────────
// 1. Staleness check on tab restore — if you return after 1+ hour, reload immediately
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    const hoursSince = (Date.now() - lastLoadTime) / 3600000;
    if (hoursSince >= 1) loadAllFeeds();
  }
});
// 2. Background interval — quietly refresh every 30 minutes while tab is visible
setInterval(() => {
  if (document.visibilityState === 'visible') loadAllFeeds();
}, 30 * 60 * 1000);
</script>
